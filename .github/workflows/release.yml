# Release: baut JK Studio (bis rc605: BehavEd-Remake) bei jeder Marke v1.0.0-rcNNN und legt einen
# ENTWURF an - mit dem Starter, genau einem Zip, Manifest, Deltas und SHA256SUMS.
# (rc601 release, REL-TEMPO 15.11.)
#
# shank: "bei jedem Release sollte es auch eine .exe geben, die gebaut wird,
# dass die Leute sie runterladen und nutzen koennen". Bis rc600 entstanden Zip
# und Notizen von Hand; die ausgelieferte .exe brauchte die VC-Laufzeit, die
# nicht im Zip lag, und ab rc598 fehlte die Download-Zeile in den Notizen.
# REL-TEMPO (shank 14.11.): "lassen wir die aktuelle exe einfach weg in Zukunft
# und bieten eine zentrale an und der Rest wird automatisch geupdated" - der
# Haupt-Download ist JK-Studio-Starter.exe (fester Name, laedt und aktualisiert),
# das Zip bleibt der Rettungsweg, die eigenstaendige .exe entfaellt als Datei
# des Releases (geprueft wird jkstudio.exe allein weiter).
#
# Regeln des eingebauten Updaters (gui/update_win32.cpp, src/update.cpp), an
# die sich dieser Ablauf halten MUSS:
#   - er fragt /releases/latest: das sieht weder Entwuerfe noch Vorab-Releases.
#     Deshalb NIE --prerelease (jede Marke v1.0.0-rcNNN enthaelt ein "-", eine
#     Regel "*-* = Vorab" wuerde jedes Release unsichtbar machen);
#   - die Updater bis rc612 installieren das ERSTE .zip des Releases: genau ein
#     .zip anhaengen; Deltas heissen deshalb .delta (ctest updater_uebergang);
#   - er vergleicht die rc-Nummer der Marke mit kFassung: die Marke muss
#     v1.0.0-<kFassung> heissen, sonst boete er das Release ewig neu an;
#   - jede Datei des Releases steht in SHA256SUMS.txt (signiert): das Zip, der
#     Starter, das Manifest und jedes Delta.
#
# Ablauf: Marke pushen -> dieser Lauf baut, prueft, laedt die Dateien als
# Artefakt hoch und legt den Entwurf an. Veroeffentlicht wird von Hand, nach
# dem Selbsttest mit genau dieser .exe - die Schritte stehen in TESTING.md,
# Abschnitt "Release builds (rc601)".
# workflow_dispatch: Probelauf ohne Release (bauen, testen, Artefakt).
#
# REL-TEMPO: der Bau geht ueber ccache (.github/actions/bauwerkzeuge, BEHAVED_CCACHE) - der Cache kommt vom
# letzten CI-Lauf auf main (ci.yml speichert ihn, Marken koennen nur lesen); die Unit-Tests laufen parallel
# (ctest -j, die langen zuerst: COST in CMakeLists.txt). Kein Test faellt weg.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # die Vorgabe des Repos ist "read"; ein Release anzulegen braucht write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    # windows-2025 = Windows Server 2025 mit Visual Studio 2026 (seit Juni
    # 2026). Fest statt windows-latest: -latest wandert.
    runs-on: windows-2025
    timeout-minutes: 300   # rc612: Bau ~60 min + Unit-Tests mit den Licht-Bau-Teilen von q3map2_teilbau (je bis ~60 min auf dem Runner)
    env:
      # Stufe 8d: die Release-Signatur. Das Geheimnis RELEASE_SIGNING_KEY (PEM des privaten
      # ECDSA-P-256-Schluessels) legt der Koordinator einmalig an (docs/intern/NOTIZEN_karte8d.md);
      # Geheimnisse sind in "if:" nicht lesbar, darum hier nur, ob es gesetzt ist.
      SIGNING_KEY_SET: ${{ secrets.RELEASE_SIGNING_KEY != '' }}
      # REL-TEMPO: Deltas von so vielen der letzten Releases (je eines; aeltere Fassungen laden das volle Paket)
      DELTA_FASSUNGEN: 3
    steps:
      - name: Line endings as committed
        # data/base/*.h und behaved.bhc sind mit CRLF eingecheckt, der Rest mit
        # LF; das Zip und die eingebauten Daten sollen genau diese Bytes haben.
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          submodules: recursive   # imgui (v1.92.9b-docking)

      - name: Version, tag and toolchain
        id: ver
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rc = python tools/release_paket.py fassung
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            # Marke == v1.0.0-<kFassung>, sonst Abbruch (Updater: istNeuer).
            python tools/release_paket.py fassung --marke $env:GITHUB_REF_NAME
          }
          python tools/lint_fassung.py
          python tools/lint_sources.py
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          Write-Host "Visual Studio $vs"
          if (-not "$vs".StartsWith('18.')) { throw "need Visual Studio 18 (2026), found '$vs'" }
          cmake --version
          python --version
          "rc=$rc" >> $env:GITHUB_OUTPUT
          # Zeitstempel im Zip = Zeit des Commits: zweimal gebaut, dieselben Bytes.
          "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> $env:GITHUB_ENV

      - name: Build tools (LLVM, ccache and its cache)
        id: werkzeuge
        uses: ./.github/actions/bauwerkzeuge

      - name: Configure
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $imgui = "$env:GITHUB_WORKSPACE/imgui" -replace '\\', '/'
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 "-DIMGUI_DIR=$imgui" "-DBEHAVED_Q3MAP2_LLVM=${{ steps.werkzeuge.outputs.llvm-bin }}" "-DBEHAVED_CCACHE=${{ steps.werkzeuge.outputs.ccache }}"

      - name: Build (second try with safe codegen, like build.bat)
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) {
            # MSVC 14.50 hatte einen internen Compilerfehler (CMakeLists.txt,
            # BEHAVED_MSVC_SAFE_CODEGEN); build.bat macht denselben zweiten Anlauf.
            Write-Host "::warning::build failed - second try with BEHAVED_MSVC_SAFE_CODEGEN=ON (/Ob1)"
            cmake -S . -B build -DBEHAVED_MSVC_SAFE_CODEGEN=ON
            cmake --build build --config Release --parallel
          }
          $rc = $LASTEXITCODE
          if ('${{ steps.werkzeuge.outputs.ccache }}' -ne '') { & '${{ steps.werkzeuge.outputs.ccache }}' --show-stats }
          exit $rc

      - name: Unit tests (no GPU, no sound, no game data)
        # Darunter exe_importe (nur Windows-DLLs fest gebunden: statische
        # Laufzeit), eingebaute_daten und release_paket; seit Stufe 3 auch
        # q3map2_importe und q3map2_vergleich (bhed_q3map2.exe gegen die
        # Erwartungen aus NRCs q3map2.exe, ohne Spieldaten), seit Stufe 5
        # q3map2_uebersetzer (die clang-cl-q3map2 liegt neben behaved.exe).
        # REL-TEMPO: alle Tests, parallel (so viele wie Kerne); die langen zuerst (COST).
        run: ctest --test-dir build -C Release --output-on-failure --timeout 900 -j $env:NUMBER_OF_PROCESSORS

      - name: Package and check
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rc = '${{ steps.ver.outputs.rc }}'
          $zip = "dist/JK-Studio-$rc-windows-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          # Stufe 3: bhed_q3map2.exe (q3map2 fuer das Build-Menue des Karten-Editors)
          # liegt im Zip neben jkstudio.exe, mit den Lizenztexten unter licenses/.
          # Stufe 8c: dazu behaved.exe als dieselbe Datei - die Updater bis rc605
          # setzen genau diesen Eintrag an die Stelle der laufenden .exe.
          # REL-TEMPO: dazu version.txt (der Starter liest die Fassung).
          python tools/release_paket.py zip build/bin/Release/jkstudio.exe $zip --q3map2 build/bin/Release/bhed_q3map2.exe
          # REL-TEMPO: der Starter ist der Haupt-Download (fester Name: releases/latest/download/JK-Studio-Starter.exe)
          Copy-Item build/bin/Release/JK-Studio-Starter.exe dist/JK-Studio-Starter.exe
          python tools/release_paket.py pruefe $zip --fassung $rc --q3map2 --starter dist/JK-Studio-Starter.exe
          python tools/release_paket.py manifest $zip "dist/JK-Studio-$rc-manifest.txt"
          python -m pip install --disable-pip-version-check --quiet pefile
          python tools/check_exe_resources.py build/bin/Release/jkstudio.exe
          # Der Befehl zuerst, dann --data (tools/bhed_cli.cpp liest argv[1] als Befehl).
          & ./build/bin/Release/bhed.exe info --data data/base

      - name: Standalone exe runs on its own
        # Die .exe ALLEIN in einem leeren Ordner, mit eigenem Einstellungsordner:
        # --pruefe-daten muss mit 0 enden (Befehlsmodell aus den eingebauten
        # Daten), ohne Fenster und ohne Meldungsfenster - ein Meldungsfenster
        # haelt den Lauf an, deshalb die Zeitgrenze. REL-TEMPO: sie ist keine Datei des
        # Releases mehr, aber alte eigenstaendige Installationen bekommen genau sie (aus dem Zip).
        run: |
          $rc = '${{ steps.ver.outputs.rc }}'
          $probe = Join-Path $env:RUNNER_TEMP 'eigenstaendig'
          New-Item -ItemType Directory -Force (Join-Path $probe 'prog'), (Join-Path $probe 'einst') | Out-Null
          $exe = Join-Path $probe "prog/JK-Studio-$rc-windows-x64.exe"
          Copy-Item build/bin/Release/jkstudio.exe $exe
          $env:BHED_EINSTELLUNGEN = Join-Path $probe 'einst'
          $out = Join-Path $probe 'ausgabe.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--pruefe-daten' -PassThru -NoNewWindow -RedirectStandardOutput $out
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'standalone exe did not exit within 60 s (message box?)' }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "standalone exe: --pruefe-daten exit code $($p.ExitCode)" }
          if (Test-Path (Join-Path $probe 'prog/data')) { throw 'standalone exe wrote a data folder next to itself' }
          if (-not (Test-Path (Join-Path $probe 'einst/data/base/behaved.bhc'))) { throw 'embedded data was not unpacked into BHED_EINSTELLUNGEN' }

      - name: Deltas from the last releases
        # REL-TEMPO: je eine der letzten DELTA_FASSUNGEN veroeffentlichten Fassungen ein Delta - nur die Inhalte, die sie
        # nicht hat (tools/release_paket.py delta). Die alte Fassung kommt als ihr Manifest; Fassungen ohne Manifest (bis
        # rc612, vor REL-TEMPO) bekommen keins: ihr Updater nimmt das Zip, und der Starter kennt ihre Fassung nicht (keine
        # version.txt) - ein Delta von ihnen luede niemand, ihr Zip (470 MB) wird darum auch nicht geladen. Jedes Delta wird
        # gegen beide Manifeste geprueft (delta-pruefen) und nur behalten, wenn es deutlich kleiner ist als das volle Paket.
        # Ohne Deltas laedt jeder Updater wie bisher das volle Paket.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rc = '${{ steps.ver.outputs.rc }}'
          $nr = [int]$rc.Substring(2)
          $zip = "dist/JK-Studio-$rc-windows-x64.zip"
          $neu = "dist/JK-Studio-$rc-manifest.txt"
          $liste = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 30 --json tagName | ConvertFrom-Json
          $vorige = @($liste | ForEach-Object { $_.tagName } | Where-Object { $_ -match '^v1\.0\.0-rc(\d+)$' -and [int]$Matches[1] -lt $nr } |
                      Sort-Object { [int]($_ -replace '^v1\.0\.0-rc', '') } -Descending | Select-Object -First ([int]$env:DELTA_FASSUNGEN))
          Write-Host "Deltas from: $($vorige -join ', ')"
          foreach ($marke in $vorige) {
            $alt = $marke -replace '^v1\.0\.0-', ''
            $ordner = Join-Path $env:RUNNER_TEMP "vorige/$alt"
            New-Item -ItemType Directory -Force $ordner | Out-Null
            $altManifest = Join-Path $ordner "JK-Studio-$alt-manifest.txt"
            $PSNativeCommandUseErrorActionPreference = $false
            gh release download $marke --repo $env:GITHUB_REPOSITORY --pattern "JK-Studio-$alt-manifest.txt" --dir $ordner 2>$null
            $PSNativeCommandUseErrorActionPreference = $true
            if (-not (Test-Path $altManifest)) { Write-Host "$marke has no manifest (before REL-TEMPO) - no delta from $alt"; continue }
            $delta = "dist/JK-Studio-$rc-from-$alt.delta"
            python tools/release_paket.py delta $zip $altManifest $delta
            python tools/release_paket.py delta-pruefen $delta $altManifest $neu
            if ((Get-Item $delta).Length -ge 0.9 * (Get-Item $zip).Length) {
              Write-Host "delta from $alt is not much smaller than the package - left out"
              Remove-Item $delta
            }
          }
          Get-ChildItem dist -Filter *.delta | Format-Table Name, Length -AutoSize
          # ein fehlendes Manifest (gh release download ohne Treffer: Rueckgabe 1) ist kein Fehler - der Runner nimmt sonst
          # den letzten $LASTEXITCODE als Ergebnis des Schritts (beim ersten Release mit Starter: keine Fassung hat ein Manifest)
          exit 0

      - name: Checksums
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rc = '${{ steps.ver.outputs.rc }}'
          # REL-TEMPO: jede Datei des Releases (Zip, Starter, Manifest, Deltas)
          $dateien = @(Get-ChildItem dist -File | Where-Object { $_.Name -notlike 'SHA256SUMS*' } | ForEach-Object { $_.FullName })
          python tools/release_paket.py pruefsummen dist/SHA256SUMS.txt @dateien
          $zips = @(Get-ChildItem dist -Filter *.zip)
          if ($zips.Count -ne 1) { throw "exactly one .zip per release (the updaters up to rc612 install the first .zip), found $($zips.Count)" }
          if (-not (Test-Path dist/JK-Studio-Starter.exe)) { throw 'JK-Studio-Starter.exe is missing' }
          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Sign checksums (SHA256SUMS.txt.sig)
        # Stufe 8d: der Updater (src/update_einspielen.cpp) prueft das .zip gegen
        # SHA256SUMS.txt; steht in include/bhed/update.h ein kSignaturSchluessel, verlangt er
        # dazu SHA256SUMS.txt.sig (ECDSA P-256 ueber SHA256SUMS.txt, DER wie openssl).
        # Ohne Geheimnis wird nicht signiert - dann darf auch kein Schluessel im Programm
        # stehen, sonst lehnte jeder Updater dieses Release ab. REL-TEMPO: dieselbe Signatur
        # deckt Starter, Manifest und Deltas ab (sie stehen in SHA256SUMS.txt).
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $eingebaut = Select-String -Path include/bhed/update.h -Pattern 'kSignaturSchluessel = "([0-9a-fA-F]*)"' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($env:SIGNING_KEY_SET -ne 'true') {
            if ("$eingebaut" -ne '') { throw 'kSignaturSchluessel is set in update.h but the secret RELEASE_SIGNING_KEY is missing - the updater would reject this release' }
            Write-Host 'no signing key: SHA256SUMS.txt only (the updater requires the checksum)'
            exit 0
          }
          if ("$eingebaut" -eq '') { Write-Host 'warning: signing, but kSignaturSchluessel in update.h is empty - the signature is not checked yet' }
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          $key = Join-Path $env:RUNNER_TEMP 'release_key.pem'
          $pub = Join-Path $env:RUNNER_TEMP 'release_pub.der'
          try {
            Set-Content -Path $key -Value $env:RELEASE_SIGNING_KEY -NoNewline
            & $openssl dgst -sha256 -sign $key -out dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
            & $openssl ec -in $key -pubout -outform DER -out $pub
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
          & $openssl dgst -sha256 -verify $pub -keyform DER -signature dist/SHA256SUMS.txt.sig dist/SHA256SUMS.txt
          if ("$eingebaut" -ne '') { python tools/release_paket.py schluessel $pub --pruefe }

      - uses: actions/upload-artifact@v7
        with:
          name: JK-Studio-${{ steps.ver.outputs.rc }}
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          # Die einzige PDB, die zu den Absturzabbildern (behaved-absturz.dmp, Dateiname wie bisher)
          # dieser .exe passt. Nicht im Release; Artefakte halten hoechstens 90 Tage.
          name: JK-Studio-${{ steps.ver.outputs.rc }}-debug-symbols
          path: build/bin/Release/jkstudio.pdb
          if-no-files-found: error
          retention-days: 90

      - name: Draft release (publish by hand after the self-test)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $rc = '${{ steps.ver.outputs.rc }}'
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          python tools/release_paket.py notizen $rc $notes
          # REL-TEMPO: der Starter zuerst (der Haupt-Download), dann das Zip, Manifest, Deltas, SHA256SUMS(.sig)
          $files = @("dist/JK-Studio-Starter.exe", "dist/JK-Studio-$rc-windows-x64.zip", "dist/JK-Studio-$rc-manifest.txt")
          $files += @(Get-ChildItem dist -Filter *.delta | ForEach-Object { "dist/$($_.Name)" })
          $files += "dist/SHA256SUMS.txt"
          if (Test-Path dist/SHA256SUMS.txt.sig) { $files += "dist/SHA256SUMS.txt.sig" }
          # NIE --prerelease: /releases/latest ueberspringt Vorab-Releases, der
          # Updater (gui/update_win32.cpp) saehe das Release nie.
          gh release create $env:GITHUB_REF_NAME @files --verify-tag --draft --title "JK Studio 1.0.0-$rc" --notes-file $notes
